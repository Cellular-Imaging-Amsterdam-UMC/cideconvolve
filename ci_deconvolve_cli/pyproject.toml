[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ci-deconvolve"
version = "0.2.0"
description = "Focused command-line CI-RL deconvolution for OME-TIFF and OME-Zarr images."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name = "NL-BioImaging contributors" },
]
keywords = ["microscopy", "deconvolution", "ome-tiff", "ome-zarr", "richardson-lucy"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
  "numpy>=1.26,<3",
  "Pillow>=10.0",
  "tifffile>=2024.1.30",
  "imagecodecs>=2024.1.1",
  "bioio==3.2.0",
  "bioio-ome-tiff==1.4.0",
  "ome-zarr>=0.9,<0.19",
  "zarr>=2.16,<4",
  "numcodecs>=0.14",
]

[project.optional-dependencies]
dev = ["pytest", "build", "twine"]

[project.scripts]
ci_deconvolve = "ci_deconvolve.cli:main"

[tool.setuptools]
packages = ["ci_deconvolve", "core"]
package-dir = { "ci_deconvolve" = "src/ci_deconvolve", "core" = "src/core" }

[tool.ruff]
line-length = 100
target-version = "py312"
