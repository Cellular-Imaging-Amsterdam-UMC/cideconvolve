citations:
- name: cideconvolve
  doi: https://github.com/Cellular-Imaging-Amsterdam-UMC/cideconvolve
  license: MIT
  description: 3D/2D deconvolution for widefield and confocal microscopy images using CI SHB-accelerated Richardson-Lucy, SHB-RL with Total Variation regularisation, or sparse-Hessian variational deconvolution. Supports GPU acceleration via CUDA (PyTorch).
docker_image:
  org: cellularimagingcf
  name: w_cideconvolve
  tag: v3.3.0
  platform: linux/amd64
algorithm_folder_name: cideconvolve_inference
exec_function:
  name: generate_cli_command
  cli_command: python wrapper.py
  hidden_args:
  - cli_tag: --local
    value: "true"
    append_value: false
    cli_order: 4
inputs:
- name: infolder
  type: image
  label: Input Images
  description: Input microscopy image folder for CIDeconvolve.
  cli_tag: --infolder
  cli_order: 1
  default: directory
  optional: false
  format:
  - tif
  - tiff
  - ometif
  - ometiff
  - png
  - jpg
  - jpeg
  - bmp
  - npy
  - zarr
  unique_string:
  - .tif
  - .tiff
  - .ome.tif
  - .ome.tiff
  - .png
  - .jpg
  - .jpeg
  - .bmp
  - .npy
  - .zarr
  folder_name: /data/in
  file_count: multiple
  section_id: inputs
  mode: beginner
  subtype:
  - grayscale
  - color
  depth: true
  timepoints: true
  tiled: true
  pyramidal: true
outputs:
- name: output_dir
  type: image
  label: Deconvolved Outputs
  description: Output folder containing OME-TIFF, OME-Zarr, benchmark CSV, and montage results.
  cli_tag: --outfolder
  cli_order: 2
  default: directory
  optional: false
  format:
  - ometiff
  - tif
  - tiff
  - zarr
  - csv
  - png
  - json
  unique_string:
  - .ome.tiff
  - .ome.tif
  - .ome.zarr
  - .csv
  - .png
  - .json
  folder_name: /data/out
  file_count: multiple
  section_id: outputs
  mode: beginner
  subtype:
  - grayscale
  - color
  depth: true
  timepoints: true
  tiled: true
  pyramidal: true
display_only: []
parameters:
- name: method
  type: dropdown
  label: Deconvolution Method
  description: Algorithm to use for deconvolution.
  options:
  - label: ci_rl
    value: ci_rl
  - label: ci_rl_tv
    value: ci_rl_tv
  - label: ci_sparse_hessian
    value: ci_sparse_hessian
  default: ci_rl
  multiselect: false
  cli_tag: --method
  cli_order: 10
  optional: true
  section_id: essential
  mode: beginner
- name: iterations
  type: textbox
  label: RL Iterations
  description: Number of iterations per channel, comma-separated. A single value applies to all channels.
  default: '60'
  cli_tag: --iterations
  cli_order: 11
  optional: true
  section_id: essential
  mode: beginner
- name: convergence
  type: dropdown
  label: Convergence Mode
  description: Early-stopping mode. Auto stops when relative change falls below the threshold; fixed runs all iterations.
  options:
  - label: auto
    value: auto
  - label: fixed
    value: fixed
  default: auto
  multiselect: false
  cli_tag: --convergence
  cli_order: 12
  optional: true
  section_id: essential
  mode: beginner
- name: rel_threshold
  type: float
  label: Convergence Threshold
  description: Relative change threshold for early stopping when convergence is auto.
  default: 0.005
  cli_tag: --rel_threshold
  cli_order: 13
  optional: true
  section_id: essential
  mode: beginner
- name: start
  type: dropdown
  label: Initial Estimate
  description: Initial estimate for iterative solvers.
  options:
  - label: auto
    value: auto
  - label: flat
    value: flat
  - label: percentile_flat
    value: percentile_flat
  - label: observed
    value: observed
  - label: observed_bgsub
    value: observed_bgsub
  - label: lowpass
    value: lowpass
  - label: lowpass_bgsub
    value: lowpass_bgsub
  - label: hybrid
    value: hybrid
  default: auto
  multiselect: false
  cli_tag: --start
  cli_order: 14
  optional: true
  section_id: essential
  mode: beginner
- name: microscope_type
  type: dropdown
  label: Microscope Type
  description: Microscope modality used for PSF generation.
  options:
  - label: widefield
    value: widefield
  - label: confocal
    value: confocal
  default: confocal
  multiselect: false
  cli_tag: --microscope_type
  cli_order: 15
  optional: true
  section_id: essential
  mode: beginner
- name: na
  type: float
  label: Numerical Aperture
  description: Objective numerical aperture, used as a fallback or override for PSF generation.
  default: 1.4
  cli_tag: --na
  cli_order: 16
  optional: true
  section_id: essential
  mode: beginner
- name: pinhole_airy
  type: textbox
  label: Confocal Pinhole (AU)
  description: Confocal pinhole diameter in Airy disk units, comma-separated per channel. Use 0 for the legacy point-detector
    model.
  default: '1'
  cli_tag: --pinhole_airy
  cli_order: 17
  optional: true
  section_id: essential
  mode: beginner
- name: refractive_index
  type: dropdown
  label: Immersion Medium
  description: Immersion medium refractive index preset.
  options:
  - label: air (1.0003)
    value: air (1.0003)
  - label: water (1.333)
    value: water (1.333)
  - label: oil (1.515)
    value: oil (1.515)
  default: oil (1.515)
  multiselect: false
  cli_tag: --refractive_index
  cli_order: 18
  optional: true
  section_id: essential
  mode: beginner
- name: sample_ri
  type: dropdown
  label: Sample / Mounting Medium
  description: Sample or mounting medium refractive index preset.
  options:
  - label: water (1.333)
    value: water (1.333)
  - label: PBS (1.334)
    value: PBS (1.334)
  - label: culture medium (1.337)
    value: culture medium (1.337)
  - label: vectashield (1.45)
    value: vectashield (1.45)
  - label: prolong gold (1.47)
    value: prolong gold (1.47)
  - label: glycerol (1.474)
    value: glycerol (1.474)
  - label: oil (1.515)
    value: oil (1.515)
  - label: prolong glass (1.52)
    value: prolong glass (1.52)
  default: prolong gold (1.47)
  multiselect: false
  cli_tag: --sample_ri
  cli_order: 19
  optional: true
  section_id: essential
  mode: beginner
- name: excitation_wl
  type: textbox
  label: Excitation Wavelengths (nm)
  description: Excitation wavelengths in nanometers, comma-separated when the input has multiple channels.
  default: '488'
  cli_tag: --excitation_wl
  cli_order: 20
  optional: true
  section_id: essential
  mode: beginner
- name: emission_wl
  type: textbox
  label: Emission Wavelengths (nm)
  description: Emission wavelengths in nanometers, comma-separated when the input has multiple channels.
  default: '520'
  cli_tag: --emission_wl
  cli_order: 21
  optional: true
  section_id: essential
  mode: beginner
- name: pixel_size_xy
  type: float
  label: Pixel Size XY (nm)
  description: Lateral pixel size in nanometers.
  default: 65.0
  cli_tag: --pixel_size_xy
  cli_order: 22
  optional: true
  section_id: essential
  mode: beginner
- name: pixel_size_z
  type: float
  label: Pixel Size Z (nm)
  description: Axial pixel size or Z step in nanometers.
  default: 200.0
  cli_tag: --pixel_size_z
  cli_order: 23
  optional: true
  section_id: essential
  mode: beginner
- name: overrule_image_metadata
  type: checkbox
  label: Overrule Image Metadata
  description: Use the supplied metadata values even when image metadata is present.
  default: false
  cli_tag: --overrule_image_metadata
  cli_order: 24
  optional: true
  append_value: true
  section_id: essential
  mode: beginner
- name: projection
  type: dropdown
  label: Z Projection
  description: Output a 2D Z projection instead of a full 3D stack. Ignored for 2D inputs.
  options:
  - label: none
    value: none
  - label: mip
    value: mip
  - label: sum
    value: sum
  - label: mean
    value: mean
  default: none
  multiselect: false
  cli_tag: --projection
  cli_order: 25
  optional: true
  section_id: essential
  mode: beginner
- name: device
  type: dropdown
  label: Compute Device
  description: Force compute device. Auto uses CUDA if available, otherwise CPU.
  options:
  - label: auto
    value: auto
  - label: cpu
    value: cpu
  - label: cuda
    value: cuda
  default: auto
  multiselect: false
  cli_tag: --device
  cli_order: 26
  optional: true
  section_id: advanced
  mode: advanced
- name: tv_lambda
  type: float
  label: TV Lambda
  description: Total Variation regularization strength for ci_rl_tv.
  default: 0.0001
  cli_tag: --tv_lambda
  cli_order: 27
  optional: true
  section_id: advanced
  mode: advanced
- name: sparse_hessian_reg
  type: float
  label: Sparse Hessian Reg
  description: Data-vs-regularizer balance for ci_sparse_hessian.
  default: 0.98
  cli_tag: --sparse_hessian_reg
  cli_order: 28
  optional: true
  section_id: advanced
  mode: advanced
- name: sparse_hessian_weight
  type: float
  label: Sparse Hessian Weight
  description: Hessian-vs-sparsity balance for ci_sparse_hessian.
  default: 0.6
  cli_tag: --sparse_hessian_weight
  cli_order: 29
  optional: true
  section_id: advanced
  mode: advanced
- name: output_format
  type: dropdown
  label: Output Format
  description: Output container for deconvolved data.
  options:
  - label: ome-tiff
    value: ome-tiff
  - label: ome-zarr
    value: ome-zarr
  default: ome-zarr
  multiselect: false
  cli_tag: --output_format
  cli_order: 30
  optional: true
  section_id: advanced
  mode: advanced
- name: output_dtype
  type: dropdown
  label: Output Data Type
  description: Save quantitative float32 output or scaled uint16 output. Uint16 uses global scaling to avoid clipping high values.
  options:
  - label: float32
    value: float32
  - label: uint16
    value: uint16
  default: float32
  multiselect: false
  cli_tag: --output_dtype
  cli_order: 31
  optional: true
  section_id: advanced
  mode: advanced
- name: streaming
  type: dropdown
  label: Large-Image Streaming
  description: Use tile reads and direct OME-Zarr writes for large images.
  options:
  - label: auto
    value: auto
  - label: always
    value: always
  - label: never
    value: never
  default: auto
  multiselect: false
  cli_tag: --streaming
  cli_order: 32
  optional: true
  section_id: advanced
  mode: advanced
- name: streaming_threshold_gb
  type: float
  label: Streaming Threshold GB
  description: Estimated full source array size above which streaming auto mode is enabled.
  default: 2.0
  cli_tag: --streaming_threshold_gb
  cli_order: 33
  optional: true
  section_id: advanced
  mode: advanced
- name: t_start
  type: integer
  label: T Start
  description: First time frame to save, using 1-based inclusive indexing.
  default: 1
  cli_tag: --t_start
  cli_order: 34
  optional: true
  section_id: advanced
  mode: advanced
- name: t_stop
  type: integer
  label: T Stop
  description: Last time frame to save, using 1-based inclusive indexing. Use 0 for the final frame.
  default: 0
  cli_tag: --t_stop
  cli_order: 35
  optional: true
  section_id: advanced
  mode: advanced
- name: t_step
  type: integer
  label: T Step
  description: Save every Nth time frame in the selected T range.
  default: 1
  cli_tag: --t_step
  cli_order: 36
  optional: true
  section_id: advanced
  mode: advanced
- name: hcs_field
  type: textbox
  label: OME-Zarr HCS Field (single field)
  description: Optional HCS field path such as A/1/0 for single-field reads. Auto selects the first field. Full HCS plate input ignores this and processes every field.
  default: auto
  cli_tag: --hcs_field
  cli_order: 37
  optional: true
  section_id: advanced
  mode: advanced
- name: benchmark
  type: checkbox
  label: Benchmark Mode
  description: Run benchmark mode on the first input image.
  default: false
  cli_tag: --benchmark
  cli_order: 38
  optional: true
  append_value: true
  section_id: advanced
  mode: advanced
- name: bench_crop
  type: checkbox
  label: Benchmark Crop
  description: Center-crop benchmark input to speed up comparison runs.
  default: false
  cli_tag: --bench_crop
  cli_order: 39
  optional: true
  append_value: true
  section_id: advanced
  mode: advanced
- name: compute_metrics
  type: checkbox
  label: Compute Image Metrics
  description: Compute optional deconvolution-effect image metrics.
  default: false
  cli_tag: --compute_metrics
  cli_order: 40
  optional: true
  append_value: true
  section_id: advanced
  mode: advanced
- name: background
  type: textbox
  label: Background Subtraction
  description: Background subtraction mode. Use auto, 0, or a numeric constant.
  default: auto
  cli_tag: --background
  cli_order: 41
  optional: true
  section_id: advanced
  mode: advanced
- name: offset
  type: textbox
  label: Offset
  description: Positive offset added during processing and removed afterwards. Use auto, none, 0, or a numeric value.
  default: auto
  cli_tag: --offset
  cli_order: 42
  optional: true
  section_id: advanced
  mode: advanced
- name: prefilter_sigma
  type: float
  label: Prefilter Sigma
  description: Sigma in pixels for Anscombe-domain Gaussian prefiltering. Use 0 to disable.
  default: 0.0
  cli_tag: --prefilter_sigma
  cli_order: 43
  optional: true
  section_id: advanced
  mode: advanced
- name: snr_mode
  type: dropdown
  label: SNR Mode
  description: Select None to disable SNR-aware setup, Auto to estimate SNR, or Manual to use SNR Value.
  options:
  - label: None
    value: none
  - label: Auto
    value: auto
  - label: Manual
    value: manual
  default: none
  multiselect: false
  cli_tag: --snr_mode
  cli_order: 44
  optional: true
  section_id: method
  mode: beginner
- name: snr_value
  type: float
  label: SNR Value
  description: Manual SNR value. Ignored when SNR Mode is None or Auto.
  default: 4.0
  min: 0.1
  max: 10000.0
  cli_tag: --snr_value
  cli_order: 45
  optional: true
  section_id: method
  mode: beginner
- name: acuity
  type: float
  label: Acuity
  description: Sharpness/smoothness balance from -100 (smooth) to +100 (sharp).
  default: 0.0
  min: -100.0
  max: 100.0
  cli_tag: --acuity
  cli_order: 46
  optional: true
  section_id: method
  mode: beginner
- name: two_d_mode
  type: dropdown
  label: 2D Widefield Mode
  description: 2D widefield deconvolution mode.
  options:
  - label: auto
    value: auto
  default: auto
  multiselect: false
  cli_tag: --two_d_mode
  cli_order: 44
  optional: true
  section_id: advanced
  mode: advanced
- name: two_d_wf_aggressiveness
  type: dropdown
  label: 2D WF Aggressiveness
  description: Aggressiveness of 2D widefield auto deconvolution.
  options:
  - label: Very Conservative
    value: Very Conservative
  - label: Conservative
    value: Conservative
  - label: Balanced
    value: Balanced
  - label: Strong
    value: Strong
  - label: Very Strong
    value: Very Strong
  default: Balanced
  multiselect: false
  cli_tag: --two_d_wf_aggressiveness
  cli_order: 45
  optional: true
  section_id: advanced
  mode: advanced
- name: two_d_wf_bg_radius_um
  type: float
  label: 2D WF Background Radius (um)
  description: Background estimator neighborhood radius in micrometers for 2D widefield auto mode.
  default: 0.5
  cli_tag: --two_d_wf_bg_radius_um
  cli_order: 46
  optional: true
  section_id: advanced
  mode: advanced
- name: two_d_wf_bg_scale
  type: float
  label: 2D WF Background Scale
  description: Multiplier applied to the auto-estimated background in 2D widefield auto mode.
  default: 1.0
  cli_tag: --two_d_wf_bg_scale
  cli_order: 47
  optional: true
  section_id: advanced
  mode: advanced
